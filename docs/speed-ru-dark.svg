<svg xmlns="http://www.w3.org/2000/svg" width="820" height="718" viewBox="0 0 820 718" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Apple Time Capsule в Windows 11: диск по AFP и встроенный SMB">
